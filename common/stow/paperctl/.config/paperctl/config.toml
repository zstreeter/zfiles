# paperctl -- committed configuration. NO SECRETS IN THIS FILE.
#
# It is in a public repo. Anything private goes in local.toml beside it, which
# is gitignored: an email address, an API key, a machine-specific path.
#
# Layers, later wins. Every one optional:
#   built-in defaults -> this file -> its [target.<name>] section ->
#   local.toml -> PAPERCTL_* env vars -> command-line flags
#
# `paperctl doctor` prints what resolved and where each value came from.

[library]
root           = "~/Library"
filename_style = "title_case"   # title_case | kebab | as_is
write_refs_bib = true
write_readme   = true

[sources]
enabled = ["arxiv", "crossref", "openalex"]
unpaywall_email = ""

# arXiv, Crossref and OpenAlex above need no key -- they are open APIs, and
# unpaywall_email is a contact address their terms ask for, not a credential.
#
# The one source that DOES need a key is alphaXiv (`paperctl pull`), and it is
# deliberately not settable here or in local.toml: keys live outside the repo,
# in ~/.config/shell/secrets.env, as `export ALPHAXIV_API_KEY="axv1_..."`.
# `paperctl doctor` reports whether it is set and whether alphaXiv accepts it.

[mail]
backend = "auto"                # auto | graph | himalaya | none

[mail.graph]
token = "~/.config/microsoft-graph/token.json"

[mail.himalaya]
bin      = "himalaya"
accounts = []                   # empty = whatever himalaya calls default

[links]
internal_domains = []

[quarto]
projects_root = "~/research"
bib_name = "library.bib"

[net]
timeout = 30
retries = 2


[target.wsl.mail]
backend = "graph"

[target.omarchy.mail]
backend  = "himalaya"
accounts = ["gmail", "work"]

[target.remote.mail]
backend = "none"

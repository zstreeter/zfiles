[General]
Name=Twitch

[Output]
Mode=Advanced
FilenameFormatting=%CCYY-%MM-%DD %hh-%mm-%ss
Reconnect=true
RetryDelay=2
MaxRetries=25

[AdvOut]
Encoder=obs_nvenc_h264_tex
ApplyServiceSettings=true
TrackIndex=1
RecType=Standard
RecFilePath=@HOME@/Videos/stream
RecFormat2=hybrid_mp4
RecEncoder=obs_nvenc_hevc_tex
RecTracks=1
Track1Bitrate=160

[Video]
BaseCX=1920
BaseCY=1080
OutputCX=1920
OutputCY=1080
FPSType=0
FPSCommon=30
ScaleType=bicubic
ColorFormat=NV12
ColorSpace=709
ColorRange=Partial

[Audio]
SampleRate=48000
ChannelSetup=Stereo

[Stream1]
EnableMultitrackVideo=false
